<VirtualHost *:80>
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all granted
        RewriteEngine On
        # Only public assets bypass HotCRP's front controller.
        RewriteRule ^(?:scripts|stylesheets|images)/ - [END]
        RewriteRule ^index\.php$ - [END]
        RewriteRule ^ index.php [END]
    </Directory>
    AddType text/javascript .mjs
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
