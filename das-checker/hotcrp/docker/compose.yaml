name: hotcrp-das-poc
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: hotcrp
      MARIADB_USER: hotcrp
      MARIADB_PASSWORD: local-test-only
      MARIADB_ROOT_PASSWORD: local-root-only
    command: ["--max-allowed-packet=128M"]
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
  web:
    build:
      context: ../../..
      dockerfile: das-checker/hotcrp/docker/Dockerfile
      target: web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_PWD: local-test-only
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
volumes:
  database:
